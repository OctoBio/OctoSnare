name: Build OctoSnare

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --target OctoSnare_VST3
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: OctoSnare-Windows-VST3
          path: build/OctoSnare_artefacts/Release/VST3/

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libfreetype6-dev libfontconfig1-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --target OctoSnare_VST3 -j 4
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: OctoSnare-Linux-VST3
          path: build/OctoSnare_artefacts/VST3/
